name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: '${{ steps.release.outputs.release_created }}'
      tag_name: '${{ steps.release.outputs.tag_name }}'
      principal_release_created: "${{ steps.release.outputs['packages/principal--release_created'] }}"
      principal_tag_name: "${{ steps.release.outputs['packages/principal--tag_name'] }}"
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: '${{ secrets.RELEASE_APP_ID }}'
          private-key: '${{ secrets.RELEASE_APP_PRIVATE_KEY }}'
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: '${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}'
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: "${{ needs.release-please.outputs.release_created == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      # write: the packed tarball is attached to the GitHub Release.
      contents: write
      packages: write
      id-token: write
    env:
      NODE_VERSION: '22'
      NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ needs.release-please.outputs.tag_name }}'
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jorisjonkers-dev'
          cache: npm
      - run: npm ci
      - name: Set package version from release tag
        run: 'npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version'
        env:
          RELEASE_TAG: '${{ needs.release-please.outputs.tag_name }}'
      - run: npm run build
      - run: npm publish --provenance
      # Public repositories install the release from this tarball, with no token, which GitHub
      # Packages asks for even for a public package.
      - name: Attach the packed package to the release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          RELEASE_TAG: '${{ needs.release-please.outputs.tag_name }}'
        run: |
          tarball=$(npm pack --silent)
          gh release upload "$RELEASE_TAG" "$tarball" --clobber

  publish-principal:
    needs: release-please
    if: "${{ needs.release-please.outputs.principal_release_created == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      NODE_VERSION: '22'
      NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ needs.release-please.outputs.principal_tag_name }}'
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jorisjonkers-dev'
          cache: npm
      - run: npm ci
      - name: Set package version from release tag
        run: 'npm version "${RELEASE_TAG#principal-v}" --no-git-tag-version --allow-same-version -w @jorisjonkers-dev/principal'
        env:
          RELEASE_TAG: '${{ needs.release-please.outputs.principal_tag_name }}'
      - run: npm run build -w @jorisjonkers-dev/principal
      - run: npm publish --provenance -w @jorisjonkers-dev/principal
      - name: Attach the packed package to the release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          RELEASE_TAG: '${{ needs.release-please.outputs.principal_tag_name }}'
        run: |
          tarball=$(npm pack --silent -w @jorisjonkers-dev/principal)
          gh release upload "$RELEASE_TAG" "$tarball" --clobber
